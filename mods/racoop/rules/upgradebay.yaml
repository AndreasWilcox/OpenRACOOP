# Upgrade Bay (see GameModeDesignDoc.md): select it, then target one of your own units to promote it
# one veterancy level, from anywhere on the map, for 25% of the unit's cost.
# It looks like the Chronosphere, without any of its powers.

UPGR:
	Inherits: ^Building
	Inherits@shape: ^2x2Shape
	RenderSprites:
		Image: pdox
	Selectable:
		Bounds: 2048, 2048
	Buildable:
		Queue: Building
		BuildPaletteOrder: 105
		Prerequisites: ~force
		BuildLimit: 1
		Description: actor-upgr.description
	Valued:
		Cost: 600
	Tooltip:
		Name: actor-upgr.name
	Building:
		Footprint: xx xx
		Dimensions: 2,2
	Health:
		HP: 100000
	Armor:
		Type: Wood
	RevealsShroud:
		MinRange: 4c0
		Range: 5c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 4c0
	WithBuildingBib:
		HasMinibib: true
	PromotesUnits:
		RequiresCondition: !build-incomplete
		CostPercentage: 25
		InsufficientFundsNotification: InsufficientFunds
		InsufficientFundsTextNotification: notification-insufficient-funds
